<title>Visualizador DXF</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen drafting tool. Toolbar on top, model space fills the screen, layer list docked right (below on phones), status line at the bottom. */
:root {
  --bg: #eef1f4;
  --panel: #ffffff;
  --fg: #18202b;
  --muted: #5b6878;
  --line: #cfd6de;
  --accent: #0f6c8c;
  --accent-fg: #ffffff;
  --hover: #e3e9ef;
  --font-ui: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  --font-data: "IBM Plex Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151a21; --panel: #1d242d; --fg: #e6ebf1; --muted: #93a1b2; --line: #333d4a;
    --accent: #58bfe0; --accent-fg: #0c1a22; --hover: #28313c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151a21; --panel: #1d242d; --fg: #e6ebf1; --muted: #93a1b2; --line: #333d4a;
  --accent: #58bfe0; --accent-fg: #0c1a22; --hover: #28313c; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px;
  display: flex; flex-direction: column; gap: 10px; box-sizing: border-box;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.bar h1 { font-size: 16px; font-weight: 600; margin: 0 8px 0 0; letter-spacing: 0.01em; }
.file { font-family: var(--font-data); font-size: 12px; color: var(--muted); min-width: 0; overflow-wrap: anywhere; flex: 1 1 160px; }
.btn {
  font: inherit; font-weight: 500; color: var(--fg); background: var(--panel);
  border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; cursor: pointer;
  display: inline-flex; align-items: center; min-height: 32px; box-sizing: border-box;
}
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn:focus-visible, .open:focus-within, .layers input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.open input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.open { position: relative; }
.work { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 10px; }
.stage { position: relative; min-height: 0; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
canvas.drag { cursor: grabbing; }
.zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; }
.zoom .btn { width: 34px; padding: 0; justify-content: center; font-family: var(--font-data); font-size: 16px; }
.msg {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
  padding: 24px; background: var(--panel); color: var(--fg); line-height: 1.5;
}
.msg p { max-width: 46ch; margin: 0; }
.drop { position: absolute; inset: 8px; border: 2px dashed var(--accent); border-radius: 4px; pointer-events: none;
  display: flex; align-items: center; justify-content: center; font-weight: 600; color: var(--accent); background: color-mix(in srgb, var(--panel) 80%, transparent); }
.layers { min-height: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
.layers header { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.layers h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0; flex: 1; }
.layers header .btn { min-height: 26px; padding: 2px 8px; font-size: 12px; }
.layers ul { list-style: none; margin: 0; padding: 4px 0; overflow-y: auto; min-height: 0; flex: 1; }
.layers label { display: grid; grid-template-columns: auto 14px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 4px 10px; cursor: pointer; }
.layers label:hover { background: var(--hover); }
.sw { width: 14px; height: 14px; border-radius: 2px; border: 1px solid var(--line); box-sizing: border-box; }
.lname { overflow-wrap: anywhere; }
.lcount { font-family: var(--font-data); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.status { display: flex; flex-wrap: wrap; gap: 4px 18px; font-family: var(--font-data); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.status b { font-weight: 500; color: var(--fg); }
@media (max-width: 720px) {
  .work { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .layers { max-height: 30vh; }
}
</style>

<div class="bar">
  <h1>Visualizador DXF</h1>
  <label class="btn primary open">Abrir DXF<input type="file" id="file-input" accept=".dxf"></label>
  <button class="btn" id="btn-fit" type="button">Enquadrar tudo</button>
  <button class="btn" id="btn-bg" type="button">Fundo claro</button>

</div>

    <div class="zoom">
      <button class="btn" id="btn-in" type="button" aria-label="Aproximar">+</button>
      <button class="btn" id="btn-out" type="button" aria-label="Afastar">&minus;</button>

    <div class="msg" id="msg" hidden><p id="msg-text"></p></div>
    <div class="drop" id="drop" hidden>Larga o DXF aqui</div>

      <h2>Layers</h2>

    <ul id="layer-list"></ul>
  </aside>
</div>

<div class="status">

      }

      var t = e.type, v, i, DEG = Math.PI / 180;
      if (t === "LINE") line([gf(e, 10, 0), gf(e, 20, 0), gf(e, 11, 0), gf(e, 21, 0)]);

      } else if (t === "CIRCLE") line(arcPts(gf(e, 10, 0), gf(e, 20, 0), gf(e, 40, 0), gf(e, 40, 0), 0, 2 * Math.PI));

        var rot = g(e, 11) !== undefined ? Math.atan2(gf(e, 21, 0), gf(e, 11, 1)) : gf(e, 50, 0) * DEG;

  }

  // ---------- Viewer state ----------
  var cv = document.getElementById("cv"), ctx = cv.getContext("2d"), stage = document.getElementById("stage");
  var prims = [], layerOn = {}, layerInfo = [], view = { s: 1, ox: 0, oy: 0 }, darkBg = true, cssW = 1, cssH = 1, queued = false;
  try { darkBg = localStorage.getItem("dxf-bg") !== "light"; } catch (err) { /* storage unavailable */ }

  var BG = { dark: "#212830", light: "#ffffff" }, FG = { dark: "#f1f4f8", light: "#151a21" }, cssCache = {};
  function colorCss(rgb) {
    if (rgb < 0) return darkBg ? FG.dark : FG.light;

    else if (darkBg && lum < 0.28) { var a = 0.45; r += (255 - r) * a; gg += (255 - gg) * a; b += (255 - b) * a; } // lift dark colors
    return (cssCache[key] = "rgb(" + Math.round(r) + "," + Math.round(gg) + "," + Math.round(b) + ")");
  }

  function schedule() { if (!queued) { queued = true; requestAnimationFrame(draw); } }

  function draw() {
    queued = false;
    var dpr = window.devicePixelRatio || 1, s = view.s;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = darkBg ? BG.dark : BG.light;
    ctx.fillRect(0, 0, cssW, cssH);
    var wx0 = -view.ox / s, wx1 = (cssW - view.ox) / s, wy1 = view.oy / s, wy0 = (view.oy - cssH) / s;
    ctx.lineWidth = 1; ctx.lineJoin = "round";
    var curStyle = null, curDash = null, open = false;
    function flush() { if (open) { ctx.stroke(); open = false; } }
    for (var i = 0; i < prims.length; i++) {
      var p = prims[i];
      if (!layerOn[p.layer]) continue;
      var b = p.box;
      if (b[2] < wx0 || b[0] > wx1 || b[3] < wy0 || b[1] > wy1) continue;
      var style = colorCss(p.rgb);
      if (p.k === 0) {
        if (style !== curStyle || p.dash !== curDash) {
          flush();
          ctx.strokeStyle = style; ctx.setLineDash(p.dash ? [6, 4] : []);
          curStyle = style; curDash = p.dash;
        }
        if (!open) { ctx.beginPath(); open = true; }
        var a = p.pts;
        ctx.moveTo(a[0] * s + view.ox, view.oy - a[1] * s);
        for (var j = 2; j < a.length; j += 2) ctx.lineTo(a[j] * s + view.ox, view.oy - a[j + 1] * s);

        for (var k = 0; k < n; k++) ctx.fillText(p.lines[k], 0, y0 + k * lh);

  }

  function fit() {
    var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    prims.forEach(function (p) {
      if (!layerOn[p.layer]) return;
      var b = p.box;
      if (b[0] < x0) x0 = b[0]; if (b[1] < y0) y0 = b[1]; if (b[2] > x1) x1 = b[2]; if (b[3] > y1) y1 = b[3];

  // ---------- Layer panel ----------

  var UNITS = { 0: "sem unidade", 1: "polegadas", 2: "pés", 4: "mm", 5: "cm", 6: "m" };
  var msg = document.getElementById("msg"), msgText = document.getElementById("msg-text");
  function showError(t) { msgText.textContent = t; msg.hidden = false; }

  function load(pairs, label, binary) {
    var doc, list;
    try { doc = parseDxf(pairs); list = flatten(doc); }

    if (!list.length) { showError("O ficheiro abriu, mas não tem linhas, arcos nem texto que eu saiba desenhar."); return; }

    prims = list;
    buildLayers(doc);
    document.getElementById("file-name").textContent = label;
    var ver = doc.version ? (VERSIONS[doc.version] ? "AutoCAD " + VERSIONS[doc.version] : doc.version) : "DXF";
    document.getElementById("st-ver").textContent = ver + (binary ? " binário" : " ASCII");
    document.getElementById("st-units").textContent = UNITS[doc.units] || "–";

  }

  function isBinary(buf) {
    return new TextDecoder("latin1").decode(buf.slice(0, BIN_SENTINEL.length)) === BIN_SENTINEL;
  }
  function decode(buf) {

    var step = 60;
    if (ev.key === "+" || ev.key === "=") zoomAt(cssW / 2, cssH / 2, 1.3);
    else if (ev.key === "-") zoomAt(cssW / 2, cssH / 2, 1 / 1.3);
    else if (ev.key === "ArrowLeft") { view.ox += step; schedule(); }
    else if (ev.key === "ArrowRight") { view.ox -= step; schedule(); }
    else if (ev.key === "ArrowUp") { view.oy += step; schedule(); }
    else if (ev.key === "ArrowDown") { view.oy -= step; schedule(); }
    else if (ev.key === "Home" || ev.key === "f") fit();
    else return;
    ev.preventDefault();

  document.getElementById("btn-out").addEventListener("click", function () { zoomAt(cssW / 2, cssH / 2, 1 / 1.4); });

  document.getElementById("btn-none").addEventListener("click", function () { setAll(false); });
  var btnBg = document.getElementById("btn-bg");

  btnBg.addEventListener("click", function () {

  var drop = document.getElementById("drop"), dragDepth = 0;

})();
</script>
